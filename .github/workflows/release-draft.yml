name: Draft release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Update release draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare version and release notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0
        with:
          commitish: ${{ github.sha }}
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
