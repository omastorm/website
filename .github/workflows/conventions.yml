name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - name: Install dependencies
        run: mise run setup
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: mise run pr-title
      - name: Check commit messages
        env:
          COMMIT_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mise run commits
